{{ define "main" }}
{{ partial "breadcrumbs.html" . }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
</header>
<div class="prose">{{ .Content }}</div>
<ul class="term-list">
  {{- range .Pages.ByWeight }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{- end }}
</ul>
{{ end }}
